name: readme-forge

secrets:
  ssh_key:
    file: ${HOST_PROJECT_DIR:-.}/forge/.secrets/ssh_key

volumes:
  forge-state:

x-hardening: &hardening
  restart: unless-stopped
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  forge-collector:
    <<: *hardening
    build:
      context: .
      dockerfile: docker/Dockerfile.collector
    image: forge-collector
    user: "10001:10001"
    # No env_file: it would also hand this container DISCORD_BOT_TOKEN.
    secrets: [ssh_key]
    environment:
      TZ: Europe/Madrid
      STATE_DIR: /state
      GITHUB_PAT: ${GITHUB_PAT}
      GITHUB_LOGIN: "${GITHUB_LOGIN:-propstgonz}"
      PROFILE_REPO: "${PROFILE_REPO:-git@github.com:propstgonz/propstgonz.git}"
      ASSETS_BRANCH: "${ASSETS_BRANCH:-assets}"
      CRON_SCHEDULE: "${CRON_SCHEDULE:-0 4 * * *}"
    volumes:
      - forge-state:/state
    tmpfs:
      - /tmp:size=64m,mode=1777

  forge-presence:
    <<: *hardening
    build:
      context: .
      dockerfile: docker/Dockerfile.presence
    image: forge-presence
    container_name: github-profile.widget
    user: "10001:10001"
    # No env_file: this container must never see GITHUB_PAT.
    environment:
      TZ: Europe/Madrid
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN}
      DISCORD_USER_ID: ${DISCORD_USER_ID}
      PORT: "${PORT:-8787}"
      WIDGETS_BASE: "${WIDGETS_BASE:-https://widgets.baronette.es}"
    volumes:
      - forge-state:/state:ro # the exposed service never writes shared state
    tmpfs:
      - /tmp:size=16m,mode=1777
      - /state-local:size=8m,mode=1777
    networks:
      - traefik-net
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik-net"
      - "traefik.http.routers.readme-forge.rule=Host(`widgets.baronette.es`)"
      - "traefik.http.routers.readme-forge.entrypoints=websecure"
      - "traefik.http.routers.readme-forge.tls=true"
      - "traefik.http.services.readme-forge.loadbalancer.server.port=8787"

networks:
  traefik-net:
    external: true
