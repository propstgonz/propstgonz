name: readme-forge

secrets:
  # The SSH key is the one credential that stays file-based: an account-level
  # key carries write access to every repo the account owns, so it must never
  # be readable via `docker inspect` or a crash dump the way an env var is.
  ssh_key:
    file: ./forge/.secrets/ssh_key

volumes:
  forge-state:

x-hardening: &hardening
  restart: unless-stopped
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  forge-collector:
    <<: *hardening
    build:
      context: .
      dockerfile: docker/Dockerfile.collector
    image: forge-collector
    user: "10001:10001"
    # No ports. This container has the keys; it does not listen.
    secrets: [ssh_key]
    env_file: .env
    environment:
      TZ: Europe/Madrid
      STATE_DIR: /state
    volumes:
      - forge-state:/state
    tmpfs:
      - /tmp:size=64m,mode=1777

  forge-presence:
    <<: *hardening
    build:
      context: .
      dockerfile: docker/Dockerfile.presence
    image: forge-presence
    user: "10001:10001"
    env_file: .env
    environment:
      TZ: Europe/Madrid
    volumes:
      - forge-state:/state:ro # the exposed service never writes shared state
    tmpfs:
      - /tmp:size=16m,mode=1777
      - /state-local:size=8m,mode=1777
    networks:
      - traefik-net
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik-net"
      - "traefik.http.routers.readme-forge.rule=Host(`widgets.baronette.es`)"
      - "traefik.http.routers.readme-forge.entrypoints=websecure"
      - "traefik.http.routers.readme-forge.tls=true"
      - "traefik.http.services.readme-forge.loadbalancer.server.port=8787"

networks:
  traefik-net:
    external: true
