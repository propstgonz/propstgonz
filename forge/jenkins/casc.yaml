jenkins:
  systemMessage: |
    readme-forge CI. Builds and deploys forge-presence.
    This Jenkins drives the host Docker daemon: do not expose it publicly.
  numExecutors: 1
  mode: NORMAL
  securityRealm:
    local:
      allowsSignup: false
      users:
        # Resolved by JCasC from $SECRETS/jenkins_admin_password (a file, not an env var).
        - id: "admin"
          password: "${jenkins_admin_password}"
  authorizationStrategy:
    loggedInUsersCanDoAnything:
      allowAnonymousRead: false

unclassified:
  location:
    url: "http://localhost:8080/"

jobs:
  - script: >
      pipelineJob('forge-presence-deploy') {
        description('Builds, smoke-tests and deploys the Discord presence bot.')
        definition {
          cpsScm {
            scm {
              git {
                remote { url('https://github.com/propstgonz/propstgonz.git') }
                branch('*/main')
              }
            }
            scriptPath('forge/Jenkinsfile')
            lightweight(true)
          }
        }
      }
