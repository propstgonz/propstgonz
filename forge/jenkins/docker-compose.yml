name: forge-ci

secrets:
  jenkins_admin_password:
    file: ./.secrets/jenkins_admin_password

volumes:
  jenkins-home:

services:
  jenkins:
    build:
      context: .
      dockerfile: Dockerfile
    image: forge-jenkins
    restart: unless-stopped
    # Needs the host's docker group to reach the socket. Set DOCKER_GID in .env
    # to `getent group docker | cut -d: -f3` on the host.
    group_add:
      - "${DOCKER_GID:-999}"
    environment:
      TZ: Europe/Madrid
      # Skips the setup wizard: the whole configuration lives in casc.yaml.
      JAVA_OPTS: "-Djenkins.install.runSetupWizard=false"
      CASC_JENKINS_CONFIG: /var/jenkins_conf/casc.yaml
      # JCasC resolves ${name} placeholders from files in this directory.
      SECRETS: /run/secrets
    secrets:
      - jenkins_admin_password
    ports:
      # Localhost only. Put it behind the reverse proxy (or a VPN) if you need
      # it remotely -- never straight onto the internet.
      - "127.0.0.1:8080:8080"
    volumes:
      - jenkins-home:/var/jenkins_home
      - ./casc.yaml:/var/jenkins_conf/casc.yaml:ro
      # Root-equivalent on the host. See the trade-off note in jenkins/README.md.
      - /var/run/docker.sock:/var/run/docker.sock
      - /srv/readme-forge:/srv/readme-forge
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
